spring:
  application:
    name: coworking-booking
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiracion: 1h
  cors:
    origins: ${APP_CORS_ORIGINS:}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  reservas:
    zona-horaria: America/Bogota
    apertura: "07:00"
    cierre: "22:00"
    duracion-minima: 30m
    duracion-maxima: 4h
    bloque: 15m
