<div class="tarjeta formulario">
  <h1>Iniciar sesión</h1>
  @if (aviso()) {
    <p class="suave">{{ aviso() }}</p>
  }
  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
  <form (ngSubmit)="entrar()">
    <label>
      Email
      <input type="email" name="email" [(ngModel)]="email" required autocomplete="email" />
    </label>
    <label>
      Contraseña
      <input type="password" name="password" [(ngModel)]="password" required autocomplete="current-password" />
    </label>
    <button type="submit" [disabled]="enviando()">Entrar</button>
  </form>
  <p class="suave">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
</div>
